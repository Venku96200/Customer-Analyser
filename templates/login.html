<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee login · Customer.Ai</title>
  <style>
    :root { color-scheme: dark; --bg:#10131a; --panel:#171b24; --border:#262c3a; --text:#e7e9ee; --muted:#9aa3b6; --accent:#4f8cff; --danger:#ef4b5f; }
    * { box-sizing:border-box; } body { min-height:100vh; margin:0; display:grid; place-items:center; background:var(--bg); color:var(--text); font:16px system-ui,sans-serif; padding:20px; }
    main { width:min(100%,400px); padding:32px; border:1px solid var(--border); border-radius:14px; background:var(--panel); } h1 { margin:0 0 8px; } p { color:var(--muted); } label { display:block; margin-top:18px; font-size:.9rem; color:var(--muted); } input,button { width:100%; padding:11px; margin-top:6px; border-radius:7px; font:inherit; } input { border:1px solid var(--border); color:var(--text); background:#0d0f15; } button { margin-top:24px; border:0; background:var(--accent); color:white; font-weight:700; cursor:pointer; } #error { min-height:20px; margin-top:14px; color:var(--danger); font-size:.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Customer.Ai</h1>
    <p>Employee sign in to access churn predictions.</p>
    <form id="login-form">
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
      <div id="error" role="alert"></div>
    </form>
  </main>
  <script>
    if (localStorage.getItem('accessToken')) location.replace('/app');
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const error = document.getElementById('error'); error.textContent = '';
      const response = await fetch('/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.fromEntries(form)) });
      const data = await response.json();
      if (!response.ok) { error.textContent = data.detail || 'Unable to sign in.'; return; }
      localStorage.setItem('accessToken', data.access_token);
      location.replace('/app');
    });
  </script>
</body>
</html>
